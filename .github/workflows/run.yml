name: 刷步数

on:
  schedule:
    # UTC 07/09:17 = 北京时间 15/17:17；当天成功后跳过后续修改。
    - cron: '17 7,9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mimotion-master
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          # 排队后的任务读取最新成功记录，避免使用旧提交重复上传。
          ref: master

      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 开始
        id: run
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          python -m pip install requests pytz pycryptodome
          python main.py

      - name: persist daily results and tokens
        if: always() && steps.run.outcome != 'skipped'
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          for file in encrypted_tokens.data daily_success.json; do
            if [ -f "$file" ]; then
              git add -- "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No daily results or token changes to persist"
            exit 0
          fi
          git commit -m "persist daily results and tokens trigger by ${{ github.event_name }}"
          git pull --rebase origin master
          git push origin HEAD:master
