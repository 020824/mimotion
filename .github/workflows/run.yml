name: 刷步数

on:
  schedule:
    # UTC 01/03/05/07/09/11:17 = 北京时间 09/11/13/15/17/19:17。
    - cron: '17 1,3,5,7,9,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mimotion-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5

      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 开始
        id: run
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          python -m pip install requests pytz pycryptodome
          python main.py

      - name: persist tokens
        if: always() && steps.run.outcome != 'skipped'
        run: |
          if [ ! -f encrypted_tokens.data ]; then
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -- encrypted_tokens.data
          if git diff --cached --quiet; then
            echo "No token changes to persist"
            exit 0
          fi
          git commit -m "persist tokens trigger by ${{ github.event_name }}"
          git pull --rebase origin master
          git push origin HEAD:master
